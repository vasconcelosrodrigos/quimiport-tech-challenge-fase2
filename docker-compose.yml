services:
  pg-docker:
    image: postgres:17-alpine
    container_name: quimiport-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: quimiport
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init/quimiport_v1.sql:/docker-entrypoint-initdb.d/quimiport_v1.sql

    networks:
      - dev-network

  api:
    build: .
    container_name: quimiport-api
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - pg-docker

    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  pgdata:
